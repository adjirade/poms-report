; =============================================================================
; POMS Report — Supervisor Production Configuration
; =============================================================================
; Instalasi (di server pabrik, asumsi project di /var/www/poms-report):
;
;   sudo cp deploy/supervisor/poms-report.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start poms-report:*
;
; Cek status semua proses:
;   sudo supervisorctl status
;
; Catatan:
; - Ganti /var/www/poms-report sesuai lokasi project aktual.
; - Ganti user=www-data sesuai user web server (Laragon lokal: cukup jalankan
;   perintah artisan secara manual, supervisor hanya untuk server Linux).
; - Log ditulis ke /var/log/poms-report/ (buat dulu: sudo mkdir -p
;   /var/log/poms-report && sudo chown www-data:www-data /var/log/poms-report)
; =============================================================================

[program:poms-queue-worker]
; Worker antrian: memproses pesan Telegram (validasi + simpan DB) dan
; job sinkronisasi HQ. numprocs=2 untuk paralelisme dan ketersediaan.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/poms-report/artisan queue:work redis --queue=telegram,default --sleep=3 --tries=3 --backoff=120 --max-time=3600 --memory=256 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
startretries=5
startsecs=5
redirect_stderr=true
stdout_logfile=/var/log/poms-report/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"

[program:poms-telegram-poll]
; Long polling Telegram Bot API. Offset polling sudah persisten di cache
; sehingga restart aman (tidak ada pesan dobel / hilang).
command=php /var/www/poms-report/artisan telegram:poll --timeout=30
autostart=true
autorestart=true
startretries=10
startsecs=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/poms-report/telegram-poll.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"

[program:poms-scheduler]
; Scheduler Laravel: menjalankan hq:sync per jam (PRD 2.2) dan task
; terjadwal lainnya. schedule:work adalah wrapper daemon di atas schedule:run.
command=php /var/www/poms-report/artisan schedule:work
autostart=true
autorestart=true
startretries=5
startsecs=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/poms-report/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"

; =============================================================================
; (Opsional) Sinkronisasi manual/ondemand via CLI tanpa menunggu scheduler:
;   cd /var/www/poms-report && sudo -u www-data php artisan hq:sync
;   sudo -u www-data php artisan hq:sync --dry-run   # lihat pending saja
; =============================================================================
