version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: poms_postgres
    environment:
      POSTGRES_DB: poms_report
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Stack
  redis:
    image: redis/redis-stack:latest
    container_name: poms_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poms_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_DATABASE: poms_report
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poms_queue
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - app
      - redis
    environment:
      DB_HOST: postgres
      DB_DATABASE: poms_report
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan queue:work redis --queue=telegram --tries=3 --sleep=3

  # Telegram Polling
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poms_telegram
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - app
      - redis
    environment:
      DB_HOST: postgres
      DB_DATABASE: poms_report
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan telegram:poll

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vendor:
    driver: local
  node_modules:
    driver: local
